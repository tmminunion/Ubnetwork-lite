<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cost Hub (Lean Budget) | UBnetwork Lite</title>
  <link rel="stylesheet" href="assets/macos.css" />
</head>
<body>
  <main class="desktop-main">
    <section class="mac-window">
      <div class="mac-titlebar">
        <div class="mac-title-left">
          <div class="tl-dots">
            <a href="index.html" class="tl-dot tl-red" title="Kembali ke Beranda"></a>
            <span class="tl-dot tl-yellow"></span>
            <span class="tl-dot tl-green"></span>
          </div>
          <a href="index.html" class="btn" style="padding:4px 10px;font-size:11px">← Beranda</a>
          <div class="icon-box g-amber" style="width:30px;height:30px;border-radius:9px;font-size:14px">C</div>
          <div>
            <div class="mac-win-title">Cost Hub · Lean Budget &amp; Consumable</div>
            <div class="mac-win-sub">Pemantauan Pemakaian Consumable &amp; Efisiensi Biaya Lokal</div>
          </div>
        </div>
        <button id="btnAddC" class="btn btn-emerald" type="button">+ Catat Pemakaian</button>
      </div>
      <div class="mac-win-body">
        <div class="glass-soft" style="padding:12px;overflow-x:auto">
          <table>
            <thead>
              <tr><th>Tanggal</th><th>Item / Consumable</th><th>Qty</th><th>Keterangan</th><th style="text-align:right">Aksi</th></tr>
            </thead>
            <tbody id="cBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="cModal" class="modal-backdrop">
    <div class="modal-card" style="display:grid;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 style="margin:0;font-size:15px;font-weight:800">Catat Pemakaian Consumable</h3>
        <button id="closeC" class="btn" type="button" style="padding:4px 9px">✕</button>
      </div>
      <div class="grid-2">
        <input id="cItem" class="input" placeholder="Nama Item (Tip, Sarung Tangan, dll)" />
        <input id="cQty" class="input mono" type="number" value="1" min="1" />
      </div>
      <input id="cNote" class="input" placeholder="Keterangan / Shift" />
      <div style="display:flex;justify-content:flex-end;gap:8px">
        <button id="cancelC" class="btn" type="button">Batal</button>
        <button id="saveC" class="btn btn-emerald" type="button">Simpan Lokal</button>
      </div>
    </div>
  </div>

  <script src="assets/db.js"></script>
  <script src="assets/macos.js"></script>
  <script>
    (function () {
      MacOS.injectChrome({ title: 'Cost Hub' });
      var KEY = 'ub_lite_cost_v1';
      var modal = document.getElementById('cModal');
      function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
      function save(arr) { localStorage.setItem(KEY, JSON.stringify(arr)); }

      function render() {
        var rows = load();
        var tb = document.getElementById('cBody');
        if (!rows.length) {
          tb.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted)">Belum ada catatan pemakaian consumable lokal.</td></tr>';
          return;
        }
        tb.innerHTML = rows.map(function (r, idx) {
          return '<tr><td class="mono">' + r.date + '</td><td style="font-weight:700">' + r.item + '</td><td class="mono">' + r.qty + '</td><td>' + (r.note || '-') + '</td>' +
            '<td style="text-align:right"><button data-i="' + idx + '" class="btn btn-rose del-c" style="padding:4px 8px;font-size:11px" type="button">Hapus</button></td></tr>';
        }).join('');
        tb.querySelectorAll('.del-c').forEach(function (b) {
          b.onclick = function () { var arr = load(); arr.splice(parseInt(b.getAttribute('data-i'), 10), 1); save(arr); render(); };
        });
      }
      document.getElementById('btnAddC').onclick = function () { modal.classList.add('open'); };
      document.getElementById('closeC').onclick = function () { modal.classList.remove('open'); };
      document.getElementById('cancelC').onclick = function () { modal.classList.remove('open'); };
      document.getElementById('saveC').onclick = function () {
        var it = document.getElementById('cItem').value.trim();
        if (!it) { UBL.toast('Nama item wajib diisi.'); return; }
        var arr = load();
        arr.unshift({ date: UBL.wibToday(), item: it, qty: parseInt(document.getElementById('cQty').value, 10) || 1, note: document.getElementById('cNote').value.trim() });
        save(arr); modal.classList.remove('open');
        document.getElementById('cItem').value = '';
        UBL.toast('Catatan cost tersimpan lokal.'); render();
      };
      render();
    })();
  </script>
</body>
</html>
